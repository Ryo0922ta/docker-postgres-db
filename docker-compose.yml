name: "docker-compose-postgres-learning"
services:
    postgres: #PostgresSqlのコンテナ設定
        build:
            context: ./postgres #dockerファイルがある相対パス
            dockerfile: Dockerfile #利用するdockerファイルの名前
        container_name: "postgres_db_learning" #コンテナ名
        platform: linux/arm64
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
            TZ: "Asia/Tokyo"
        # 💡 DBが本当に接続可能かを判定するヘルスチェックを追加
        healthcheck:
            test:
                ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
            interval: 5s
            timeout: 5s
            retries: 5
        ports:
            - "127.0.0.1:${POSTGRES_PORT}:5432" # ホスト→コンテナのポート転送（左: Mac側、右: コンテナ側）
        volumes:
            - postgres_data:/var/lib/postgresql/data
            # - ./postgres/sql:/docker-entrypoint-initdb.d # 初期化SQLを自動実行するフォルダ 現段階で不必要なのでコメントアウト
        networks:
            - db_network_learning
        deploy:
            # 【改善】DB暴走時にホストPCがフリーズしないようリソース上限を設定
            resources:
                limits:
                    cpus: "1.5"
                    memory: 2G

    pgadmin:
        image: dpage/pgadmin4:8.6
        container_name: "pgadmin4_learning" #コンテナ名
        environment:
            PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL} # ログイン用メールアドレス
            PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD} # ログイン用パスワード
            PGADMIN_CONFIG_SERVER_MODE: "False"
            PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False" #セキュリティを無効化する危険な設定である。開発用であるためコメントとして明示しておく
            TZ: "Asia/Tokyo" # タイムゾーン設定
        ports:
            - "127.0.0.1:${PGADMIN_PORT}:80"
        volumes:
            - pgadmin_data:/var/lib/pgadmin #設定データの永続化
        depends_on:
            postgres:
                condition: service_healthy #PostgreSQLコンテナが起動してから立ち上げるよう指定
        networks:
            - db_network_learning
        deploy:
            # 【改善】pgAdminも無尽蔵にリソースを食わないよう制限
            resources:
                limits:
                    cpus: "0.5"
                    memory: 512M

#データを保存するための永続定義
volumes:
    postgres_data:
        name: postgres_data_learning #ボリューム名を指定することで、docker-compose downしてもデータが消えないようにする
        driver: "local"
    pgadmin_data:
        name: pgadmin_data_learning #ボリューム名を指定することで、docker-compose downしてもデータが消えないようにする
        driver: "local"

# =========================================
# ネットワーク定義 (コンテナ間の隔離)
# =========================================
networks:
    db_network_learning:
        driver: bridge
